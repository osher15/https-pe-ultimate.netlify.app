# בנייה של גרסאות החנות (Capacitor) — אנדרואיד ואייפון
#
# הסביבה שבה הקוד נכתב לא יכולה להוריד את ה-Android SDK, ו-iOS נבנה
# רק על Mac. לכן הבנייה עצמה רצה כאן:
#   android — APK לבדיקה (debug, חתום במפתח debug של Gradle). ניתן להוריד
#             מ-Artifacts ולהתקין ישירות בטלפון. זו לא גרסת חנות: להעלאה
#             ל-Google Play צריך AAB חתום במפתח ההעלאה של הבעלים.
#   ios     — קומפילציה לסימולטור בלי חתימה. מוכיחה שהפרויקט נבנה ב-Xcode;
#             התקנה באייפון אמיתי דורשת חתימה בחשבון המפתח של הבעלים (Mac).
#
# אין כאן סודות, אין חתימת הפצה ואין העלאה לחנות.
name: Native builds

on:
  pull_request:
    paths: ["native/**", "hm-*.js", "hm-*.css", "fonts/**", "index.html", ".github/workflows/native.yml"]
  push:
    branches: [main]
    paths: ["native/**", "hm-*.js", "hm-*.css", "fonts/**", "index.html", ".github/workflows/native.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android — APK לבדיקה
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: התקנת Capacitor
        working-directory: native
        run: npm ci
      - name: העתקת האתר ל-www וסנכרון
        working-directory: native
        run: |
          node build-web.js
          npx cap sync android
      - name: בניית APK
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: שם הקובץ עם הגרסה
        run: |
          B=$(grep -o 'name="hm-build" content="[0-9a-f]*"' index.html | grep -o '[0-9a-f]\{8\}')
          mv native/android/app/build/outputs/apk/debug/app-debug.apk "pe-ultimate-debug-$B-${GITHUB_SHA::7}.apk"
          ls -la pe-ultimate-debug-*.apk
      - name: חתימה קבועה (כדי ש-APK חדש יותקן כעדכון, בלי למחוק נתונים)
        run: |
          S=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$S" verify --print-certs pe-ultimate-debug-*.apk | tee cert.txt
          # טביעת SHA-256 של native/android/app/debug.keystore
          grep -qi "SHA-256 digest: 0012ad51ac19872284d6e22a4386c00c529e33567d24139a6a598709c0d4328d" cert.txt \
            || { echo "::error::ה-APK לא נחתם במפתח ה-debug הקבוע של הפרויקט"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pe-ultimate-android-debug
          path: pe-ultimate-debug-*.apk
          retention-days: 30

  ios:
    name: iOS — קומפילציה (סימולטור, בלי חתימה)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Xcode 26 (Capacitor 8 ו-App Store דורשים SDK של iOS 26)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::אין Xcode 26 בתמונת הריצה"; ls -d /Applications/Xcode*; exit 1; fi
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: התקנת Capacitor
        working-directory: native
        run: npm ci
      - name: העתקת האתר ל-www וסנכרון
        working-directory: native
        run: |
          node build-web.js
          npx cap sync ios
      - name: בנייה
        working-directory: native/ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -60
