name: Codex candidate build
on:
  push:
    branches: ["codex/questionnaire-action-plan-2026-10-03"]
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/codex/questionnaire-action-plan-2026-10-03'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build candidate and check units
        run: |
          npm test
          node build-standalone.js
          git add -- Hamegrash.html index.html sw.js
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "build: synchronize Codex candidate generated outputs"
            git push origin HEAD:codex/questionnaire-action-plan-2026-10-03
          fi
      - name: Verify deterministic build
        run: |
          node build-standalone.js
          git diff --exit-code -- Hamegrash.html index.html sw.js
