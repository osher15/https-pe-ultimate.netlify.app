# פריסה סטטית — אין שלב בנייה לאפליקציה עצמה (Hamegrash.html ו-index.html
# נבנים ונבדקים לפני ה-commit). הפקודה היחידה כותבת version.json עם ה-commit
# ומועד הפריסה בפועל, כדי שההגדרות יציגו גרסה אמיתית.
[build]
  publish = "."
  command = "node tools/stamp-version.js"

# חיסכון בקרדיטים: תצוגות מקדימות (PR) ופריסות ענפים לא נבנות — רק main מתפרסם.
# הבדיקות רצות ב-GitHub Actions ובדפדפן מקומי, והאתר סטטי. כדי להחזיר תצוגות
# מקדימות מוחקים את שני הבלוקים הבאים. exit 0 = דלג על הבנייה.
[context.deploy-preview]
  ignore = "exit 0"

[context.branch-deploy]
  ignore = "exit 0"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# קבצי hm-*.js / hm-*.css נטענים תמיד עם ?v=<hash> מ-index.html (build-standalone.js),
# כך ששינוי תוכן = כתובת חדשה, ומותר לשמור אותם במטמון לשנה.
[[headers]]
  for = "/hm-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/hm-*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# פרויקט המעטפת לחנויות (native/) נמצא במאגר אבל אינו חלק מהאתר
[[redirects]]
  from = "/native/*"
  to = "/404"
  status = 404
  force = true
