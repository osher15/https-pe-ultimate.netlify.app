<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#111"/></marker>
  </defs>
  <rect width="1200" height="300" fill="#fff"/>
  <text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#111">PE Ultimate — Diagram Legend</text>

  <polygon points="80,110 55,155 105,155" fill="#2463eb" stroke="#0f172a" stroke-width="2"/>
  <text x="80" y="146" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">1</text>
  <text x="125" y="140" font-family="Arial" font-size="22">Team A / attacker</text>

  <rect x="310" y="110" width="48" height="48" rx="4" fill="#dc2626" stroke="#0f172a" stroke-width="2"/>
  <text x="334" y="142" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#fff">2</text>
  <text x="380" y="140" font-family="Arial" font-size="22">Team B / defender</text>

  <circle cx="655" cy="134" r="14" fill="#f59e0b" stroke="#111" stroke-width="2"/>
  <text x="685" y="140" font-family="Arial" font-size="22">Ball</text>

  <line x1="810" y1="134" x2="930" y2="134" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="945" y="140" font-family="Arial" font-size="22">Movement</text>

  <line x1="55" y1="230" x2="175" y2="230" stroke="#111" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="190" y="236" font-family="Arial" font-size="22">Pass</text>

  <path d="M360 230 C380 205,400 255,420 230 C440 205,460 255,480 230" fill="none" stroke="#111" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="505" y="236" font-family="Arial" font-size="22">Dribble / carry</text>

  <polygon points="760,205 745,245 775,245" fill="#f97316" stroke="#111" stroke-width="2"/>
  <text x="800" y="236" font-family="Arial" font-size="22">Cone</text>

  <rect x="930" y="205" width="170" height="48" fill="#fde68a" fill-opacity="0.55" stroke="#d97706" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1015" y="236" text-anchor="middle" font-family="Arial" font-size="20">Highlighted zone</text>
</svg>