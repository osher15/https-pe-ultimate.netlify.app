<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Interval Trainer · PE Tools</title>
<!--
  PE Tools · Interval Trainer — standalone, offline, no account, no student data.
  Extracted from the fitness trainer module (FIT) of the project's main PE app: interval timer presets,
  class station circuits, exercise library, fitness dice. Built for task C9 (store-content).
  Data block below is generated by tools/extract-app-data.cjs from the app's own source and
  translations; edit the extractor, not the block. Settings key: pe-tools.interval-trainer.v1
  Media: one cartoon animation + one still per exercise id, own drawings (store-content/exercise-anim).
  This file is the readable SOURCE. In a checkout it loads ../../exercise-anim/out/{svg,still}/<id>.svg.
  tools/build-single-file.cjs embeds those SVGs into the PE_IT_ANIM block below and writes the
  self-contained offline deliverable interval-trainer.single.html (CSP there: img-src data: only).
-->
<style>
:root{
  --bg:#0f141c;--panel:#18202b;--panel2:#202a37;--line:#2e3a4a;--text:#eef2f7;--muted:#a9b4c3;
  --acc:#38bdf8;--acc-ink:#04131c;--work:#16a34a;--rest:#d97706;--prep:#475569;--done:#7c3aed;--warn:#f59e0b;
  --radius:14px;--tap:48px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Hebrew","Noto Sans Arabic",Arial,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 32px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between;padding:4px 0 12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand small{color:var(--acc);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:12px}
.brand h1{margin:0;font-size:22px;line-height:1.2}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools select{min-height:40px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px 8px}
.chip{min-height:40px;min-width:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip:disabled{opacity:.45;cursor:not-allowed}
nav.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:14px}
nav.tabs button{min-height:var(--tap);padding:8px 6px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:600;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
nav.tabs button[aria-selected="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
@media (max-width:620px){nav.tabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px}
.hint{color:var(--muted);font-size:14px;margin:0 0 10px}
.grid-pre{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pre{min-height:64px;text-align:start;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pre b{font-size:15px}.pre span{color:var(--muted);font-size:13px;direction:ltr;unicode-bidi:isolate}
.pre[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field select{min-height:var(--tap);width:100%;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.total{margin:10px 0 0;color:var(--muted);font-size:14px}
.btn{min-height:var(--tap);padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.acc{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.chip:focus-visible,nav.tabs button:focus-visible,.pre:focus-visible,.ex:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* run panel */
.run{position:relative;border-radius:var(--radius);padding:16px;margin-bottom:14px;background:var(--prep);transition:background .25s;text-align:center;overflow:hidden}
.run[data-ph="work"]{background:var(--work)}
.run[data-ph="rest"],.run[data-ph="setrest"]{background:var(--rest)}
.run[data-ph="done"]{background:var(--done)}
.run[data-paused="1"]{filter:saturate(.35)}
.run-ph{font-size:clamp(20px,5vw,32px);font-weight:800;min-height:1.3em;overflow-wrap:anywhere}
.run-meta{font-size:15px;opacity:.9;min-height:1.3em}
.run-time{font-size:clamp(84px,26vw,200px);font-weight:900;line-height:1;margin:6px 0;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.run-next{font-size:clamp(15px,3.6vw,22px);min-height:1.4em;opacity:.95;overflow-wrap:anywhere}
.prog{height:10px;border-radius:99px;background:rgba(0,0,0,.25);margin:12px 0 4px;overflow:hidden;position:relative}
.prog i{position:absolute;inset-block:0;inset-inline-start:0;width:0;background:rgba(255,255,255,.85);border-radius:99px}
.run-ctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.run-ctl .btn{flex:1 1 120px;background:rgba(0,0,0,.28);border-color:rgba(255,255,255,.25);color:#fff}
.run-ctl .btn.acc{background:#fff;color:#0b1220;border-color:#fff;flex-basis:100%}
.run-ctl .btn.acc:disabled{display:none}  /* while running, Start is hidden so the gym display stays clean */
.run-fig{display:none}
/* gym display mode (CSS overlay; also asks the browser for real full screen when available) */
body.display{overflow:hidden}
body.display .run.show{position:fixed;inset:0;z-index:50;margin:0;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
body.display .run.show .run-time{font-size:min(38vw,52vh)}
body.display .run.show .run-ph{font-size:min(8vw,7vh)}
body.display .run.show .run-next{font-size:min(5vw,4.5vh)}
body.display .run.show .run-fig{display:block;margin:0 auto;max-height:22vh}
body.display .run.show .run-fig img,body.display .run.show .run-fig .ph-img{width:min(22vh,40vw);height:min(22vh,40vw)}
body.display .run.show .run-ctl{max-width:720px;margin-inline:auto;width:100%}
/* circuit list */
.st-list{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.st{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;background:var(--panel2);border:1px solid transparent}
.st.now{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.st .ix{width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:800;flex:none}
.st .nm{flex:1;min-width:0}.st .nm b{display:block;overflow-wrap:anywhere}.st .nm span{color:var(--muted);font-size:13px}
.thumb{width:52px;height:52px;flex:none;border-radius:10px;background:#1c2431;object-fit:contain}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
/* library */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ex{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;text-align:center;min-width:0}
.ex img,.ex .ph-img{width:96px;height:96px;border-radius:10px;object-fit:contain;background:#1c2431}
.ex b{font-size:14px;overflow-wrap:anywhere}.ex span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.ph-img{display:grid;place-items:center;color:var(--muted);background:#1c2431;border:1px dashed var(--line)}
.ph-img svg{width:50%;height:50%}
@media (max-width:400px){.exgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
dialog{width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dlg-h h3{margin:0;font-size:18px;overflow-wrap:anywhere}
.dlg-b{padding:12px 14px 16px}
.dlg-fig{display:flex;justify-content:center;margin-bottom:10px}
.dlg-fig img,.dlg-fig .ph-img{width:180px;height:180px;border-radius:14px;object-fit:contain;background:#1c2431}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{padding:3px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:13px}
.pill.acc{border-color:var(--acc);color:var(--acc)}
.dlg-b h4{margin:12px 0 4px;font-size:15px}
.dlg-b ul{margin:0;padding-inline-start:20px;line-height:1.6}
.dlg-b p{margin:6px 0}
/* dice */
.dice{display:flex;gap:16px;justify-content:center;margin:16px 0}
.die{width:min(150px,40vw);aspect-ratio:1;border-radius:22px;background:#fff;color:#0b1220;display:grid;place-items:center;text-align:center;padding:8px;box-shadow:0 8px 0 rgba(0,0,0,.35)}
.die .top{font-size:28px;font-weight:900;line-height:1.15;overflow-wrap:anywhere}
.die .top.sm{font-size:16px}
.die .bot{font-size:13px;color:#475569;margin-top:4px}
.die.roll{animation:roll .65s ease-out}
@keyframes roll{0%{transform:rotate(0) scale(.9)}50%{transform:rotate(200deg) scale(1.08)}100%{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}.run{transition:none}}
.dice-res{font-size:22px;font-weight:800;min-height:1.4em;text-align:center}
.dice-fig{display:flex;justify-content:center;min-height:0;margin-top:8px}
.dice-fig img,.dice-fig .ph-img{width:120px;height:120px;border-radius:14px;object-fit:contain;background:#1c2431}
.note{border:1px solid var(--warn);color:#fde68a;background:rgba(245,158,11,.1);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
footer p{margin:4px 0}
/* C18 device-data dialog */
.dd p{margin:8px 0;overflow-wrap:anywhere;line-height:1.5}
.dd .dd-meta{font-size:13px;opacity:.8}
.dd-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.dd-actions button{flex:1 1 150px;min-height:48px}
.dd-skipwrap{margin-top:6px!important}
.dd-link{background:none!important;border:0!important;text-decoration:underline;min-height:44px;padding:8px 4px;cursor:pointer;font-size:13px;color:inherit;opacity:.75;text-align:start}
.dd-danger{background:#6b2730!important;color:#fff!important;border:1px solid #a5434d!important}
.dd-danger:disabled{opacity:.45;cursor:not-allowed}
.dd input{display:block;width:100%;min-height:48px;margin-top:8px;padding:8px 12px}
.dd-msg{min-height:1.4em;color:#ffb5ae}
.dd [hidden]{display:none!important}
.dd button:focus-visible,.dd input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.dd-danger-open{color:#ffb5ae}
.dd-open{color:#ffb5ae}
.dd{padding:16px}
.dd h2{margin:0 0 8px;font-size:20px;overflow-wrap:anywhere}
.dd input{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px}
.dd-foot{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><small data-i18n="brand">PE Tools</small><h1 data-i18n="app.name">Interval Trainer</h1></div>
    <div class="tools">
      <label class="vh" for="lang" data-i18n="ui.lang">Language</label>
      <select id="lang">
        <option value="en">English</option><option value="he">עברית</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="es">Español</option>
      </select>
      <button class="chip" id="snd" aria-pressed="true"><span aria-hidden="true">🔊</span> <span data-i18n="ui.sound">Sound</span></button>
      <button class="chip" id="voice" aria-pressed="false"><span aria-hidden="true">🗣</span> <span data-i18n="ui.voice">Voice</span></button>
      <button class="chip" id="test-snd" data-i18n="ui.testSound">Test sound</button>
      <button class="chip" id="about-btn" data-i18n="ui.about">About</button>
    </div>
  </header>

  <div class="note" id="store-note" role="status" hidden data-i18n="st.blocked"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-timer" aria-controls="sec-timer" data-tab="timer" aria-selected="true"><span aria-hidden="true">⏱</span> <span data-i18n="tab.timer">Interval timer</span></button>
    <button role="tab" id="tab-circuit" aria-controls="sec-circuit" data-tab="circuit" aria-selected="false"><span aria-hidden="true">🔁</span> <span data-i18n="tab.circuit">Class stations</span></button>
    <button role="tab" id="tab-lib" aria-controls="sec-lib" data-tab="lib" aria-selected="false"><span aria-hidden="true">📖</span> <span data-i18n="tab.lib">Exercise library</span></button>
    <button role="tab" id="tab-dice" aria-controls="sec-dice" data-tab="dice" aria-selected="false"><span aria-hidden="true">🎲</span> <span data-i18n="tab.dice">Fitness dice</span></button>
  </nav>

  <!-- interval timer -->
  <section id="sec-timer" role="tabpanel" aria-labelledby="tab-timer">
    <div class="card">
      <h2 data-i18n="t.presets">Quick templates</h2>
      <div class="grid-pre" id="presets"></div>
      <div class="fields">
        <div class="field"><label for="t-w" data-i18n="t.work">Work (s)</label><input type="number" inputmode="numeric" id="t-w" min="5" max="3600"></div>
        <div class="field"><label for="t-r" data-i18n="t.rest">Rest (s)</label><input type="number" inputmode="numeric" id="t-r" min="0" max="3600"></div>
        <div class="field"><label for="t-n" data-i18n="t.rounds">Rounds</label><input type="number" inputmode="numeric" id="t-n" min="1" max="99"></div>
        <div class="field"><label for="t-s" data-i18n="t.sets">Sets</label><input type="number" inputmode="numeric" id="t-s" min="1" max="20"></div>
        <div class="field"><label for="t-sr" data-i18n="t.setRest">Rest between sets</label><input type="number" inputmode="numeric" id="t-sr" min="0" max="3600"></div>
      </div>
      <p class="total" id="t-total"></p>
    </div>
    <section class="run" id="t-run" data-ph="idle" aria-label="Interval timer">
      <div class="run-ph" id="t-ph" aria-live="polite"></div>
      <div class="run-meta" id="t-meta"></div>
      <div class="run-time" id="t-time">--</div>
      <div class="run-next" id="t-next"></div>
      <div class="prog"><i id="t-bar"></i></div>
      <div class="run-ctl">
        <button class="btn acc" id="t-go"><span aria-hidden="true">▶</span> <span data-i18n="t.start">Start workout</span></button>
        <button class="btn" id="t-pause" disabled><span aria-hidden="true">⏸</span> <span data-i18n="t.pause">Pause</span></button>
        <button class="btn" id="t-skip" disabled><span aria-hidden="true">⏭</span> <span data-i18n="t.skip">Skip</span></button>
        <button class="btn" id="t-stop" disabled><span aria-hidden="true">⏹</span> <span data-i18n="t.stop">Stop</span></button>
        <button class="btn" id="t-full"><span aria-hidden="true">⛶</span> <span data-i18n="ui.full">Full screen</span></button>
      </div>
    </section>
  </section>

  <!-- class stations -->
  <section id="sec-circuit" role="tabpanel" aria-labelledby="tab-circuit" hidden>
    <div class="card">
      <h2 data-i18n="c.title">Station workout generator</h2>
      <div class="fields">
        <div class="field"><label for="c-focus" data-i18n="c.focus">Focus</label>
          <select id="c-focus"><option value="mix" data-i18n="grp.mix">Combined</option><option value="strength" data-i18n="grp.strength">Strength</option><option value="cardio" data-i18n="grp.cardio">Aerobic</option><option value="core" data-i18n="grp.core">Core</option><option value="mobility" data-i18n="grp.mobility">Mobility</option></select></div>
        <div class="field"><label for="c-n" data-i18n="c.stations">Stations</label><input type="number" inputmode="numeric" id="c-n" min="2" max="12"></div>
        <div class="field"><label for="c-t" data-i18n="c.time">Time per station (s)</label><input type="number" inputmode="numeric" id="c-t" min="10" max="600"></div>
        <div class="field"><label for="c-r" data-i18n="c.change">Changeover (s)</label><input type="number" inputmode="numeric" id="c-r" min="5" max="300"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="btn acc" id="c-gen"><span aria-hidden="true">🎰</span> <span data-i18n="c.gen">Draw stations</span></button></div>
      <p class="total" id="c-total"></p>
    </div>
    <div class="card" id="c-plan" hidden>
      <h2 data-i18n="c.plan">Station plan</h2>
      <div class="st-list" id="c-list"></div>
    </div>
    <section class="run" id="c-run" data-ph="idle" aria-label="Class stations" hidden>
      <div class="run-ph" id="c-ph" aria-live="polite"></div>
      <div class="run-meta" id="c-meta"></div>
      <div class="run-fig" id="c-fig"></div>
      <div class="run-time" id="c-time">--</div>
      <div class="run-next" id="c-next"></div>
      <div class="prog"><i id="c-bar"></i></div>
      <div class="run-ctl">
        <button class="btn acc" id="c-go"><span aria-hidden="true">▶</span> <span data-i18n="c.start">Run station rotation</span></button>
        <button class="btn" id="c-pause" disabled><span aria-hidden="true">⏸</span> <span data-i18n="t.pause">Pause</span></button>
        <button class="btn" id="c-skip" disabled><span aria-hidden="true">⏭</span> <span data-i18n="t.skip">Skip</span></button>
        <button class="btn" id="c-stop" disabled><span aria-hidden="true">⏹</span> <span data-i18n="t.stop">Stop</span></button>
        <button class="btn" id="c-full"><span aria-hidden="true">⛶</span> <span data-i18n="ui.full">Full screen</span></button>
      </div>
    </section>
  </section>

  <!-- exercise library -->
  <section id="sec-lib" role="tabpanel" aria-labelledby="tab-lib" hidden>
    <div class="card">
      <h2 data-i18n="l.title">Exercise library</h2>
      <p class="hint" data-i18n="l.tap">Tap an exercise for details.</p>
      <div class="filters" id="l-filters"></div>
      <div class="exgrid" id="l-grid"></div>
    </div>
  </section>

  <!-- fitness dice -->
  <section id="sec-dice" role="tabpanel" aria-labelledby="tab-dice" hidden>
    <div class="card" style="text-align:center">
      <h2 data-i18n="d.title">Fitness dice · class game</h2>
      <p class="hint" data-i18n="d.hint"></p>
      <div class="dice">
        <div class="die" id="die1"><div><div class="top" aria-hidden="true">🎲</div><div class="bot" data-i18n="d.ex">Exercise</div></div></div>
        <div class="die" id="die2"><div><div class="top" aria-hidden="true">🎲</div><div class="bot" data-i18n="d.amt">Amount</div></div></div>
      </div>
      <div class="dice-res" id="dice-res" aria-live="polite"></div>
      <div class="dice-fig" id="dice-fig"></div>
      <button class="btn acc" id="roll" style="margin-top:12px;min-width:220px"><span aria-hidden="true">🎲</span> <span data-i18n="d.roll">Roll the dice!</span></button>
    </div>
  </section>

  <footer>
    <p class="dd-foot"><button type="button" class="btn" id="dd-restore" data-dd-page="restoreBtn">Restore from backup file</button><button type="button" class="btn dd-open" id="dd-open" data-dd-page="btn">Delete all data on this device</button></p>
    <p><strong data-i18n="about.safetyH">Safety</strong>: <span data-i18n="safety.short"></span></p>
    <p><span data-i18n="brand">PE Tools</span> · <span id="ver"></span></p>
  </footer>
</div>

<dialog id="ex-dlg" aria-labelledby="ex-title">
  <div class="dlg-h"><h3 id="ex-title"></h3><button class="btn" data-close data-i18n-aria="ui.close" aria-label="Close">✕</button></div>
  <div class="dlg-b" id="ex-body"></div>
</dialog>

 terceros."],"about.safety":["The teacher supervises at all times. The exercises and volumes are suggestions, not medical or training advice: adapt them to each student's ability, allow rest, and stop an exercise if there is pain or dizziness.","המורה משגיח/ה כל הזמן. התרגילים והמינונים הם הצעות, לא ייעוץ רפואי או אימוני: התאימו אותם ליכולת של כל תלמיד/ה, אפשרו מנוחה, והפסיקו תרגיל אם יש כאב או סחרחורת.","يشرف المعلّم طوال الوقت. التمارين والجرعات اقتراحات وليست نصيحة طبية أو تدريبية: كيِّفوها وفق قدرة كل طالب، واسمحوا بالراحة، وأوقفوا التمرين عند الشعور بألم أو دوار.","Учитель всё время наблюдает за занятием. Упражнения и дозировки — это предложения, а не медицинские или тренировочные рекомендации: адаптируйте их к возможностям каждого ученика, давайте отдых и прекращайте упражнение при боли или головокружении.","El docente supervisa en todo momento. Los ejercicios y volúmenes son sugerencias, no consejos médicos ni de entrenamiento: adáptalos a la capacidad de cada alumno, permite descansos y detén el ejercicio si hay dolor o mareo."],"about.offline":["Works without an internet connection once the file is open. Keep the media folder next to this file.","עובד בלי חיבור לאינטרנט אחרי שהקובץ נפתח. השאירו את תיקיית media ליד הקובץ.","يعمل دون اتصال بالإنترنت بعد فتح الملف. أبقِ مجلد media بجانب هذا الملف.","После открытия файла работает без интернета. Храните папку media рядом с этим файлом.","Funciona sin conexión a internet una vez abierto el archivo. Mantén la carpeta media junto a este archivo."],"about.i18nH":["Translations","תרגומים","الترجمات","Переводы","Traducciones"],"about.i18n":["Translations were produced with AI. The professional content is accurate and was reviewed by several teachers and checked against Ministry of Education curricula from all angles; small proofreading, syntax or terminology errors are possible.","התרגומים הופקו בעזרת בינה מלאכותית. התוכן המקצועי מדויק, נבדק על ידי כמה מורים ונבחן מול תוכניות הלימודים של משרד החינוך מכל הכיוונים; ייתכ     if(st.done){ finish(r); return; }
    const ph=st.phase;
    if(st.i!==r.lastI){ if(r.lastI!==-1||ph.kind!=="prep")onPhase(r,ph); r.lastI=st.i; force=true; }
    if(st.running&&st.remain<=3&&st.remain>=1&&r.lastRemain!==st.remain&&r.lastRemain!==null)beep(660,0.09);
    r.lastRemain=st.remain;
    const run=el(r,"run"); run.dataset.ph=ph.kind; run.dataset.paused=st.paused?"1":"0";
    el(r,"time").textContent=E.fmtRemain(st.remain);
    el(r,"bar").style.width=Math.min(100,st.elapsed/st.total*100)+"%";
    {
      el(r,"ph").textContent=st.paused?t("t.paused")+" · "+phaseLabel(r,ph):phaseLabel(r,ph);
      const nx=r.runner.phases[st.i+1];
      if(r.kind==="timer")el(r,"next").textContent=nx?t("t.next",phaseLabel(r,nx)):t("t.last");
      else el(r,"next").textContent=ph.kind==="work"?(r.list[ph.station+1]?t("c.next",L(EXI[r.list[ph.station+1]].name)):t("c.last")):(ph.kind==="rest"?t("c.next",L(EXI[r.list[ph.station]].name)):"");
      const meta=r.kind==="timer"?t("t.remaining",E.fmtClock(st.total-st.elapsed))
        :t("c.count",Math.min((ph.station||0)+1,r.list.length),r.list.length)+" · "+t("t.remaining",E.fmtClock(st.total-st.elapsed));
      el(r,"meta").textContent=meta;
      if(r.kind==="circuit"){ const id=r.list[ph.station||0]; const f=el(r,"fig"); if(f.dataset.id!==id||force){ f.dataset.id=id; f.innerHTML=figHTML(EXI[id],160,"",true); } }
    }
  }
  function tick(){ if(active)paint(active,false); }
  function finish(r){
    clearInterval(ticker); ticker=0; active=null; keepAwake(false);
    r.finished=true; horn(); say(r.kind==="timer"?t("say.done"):t("say.cDone"));
    if(r.kind==="circuit")renderPlan(-1);
    renderIdle(r);
  }
  function stop(r,silent){
    if(!r.runner)return;
    r.runner.stop(); if(active===r){ active=null; clearInterval(ticker); ticker=0; keepAwake(false); }
    r.finished=false; r.stoppedMsg=!silent; if(r.kind==="circuit")renderPlan(-1); renderIdle(r);
  }
  function pauseToggle(r){
    if(active!==r)return; const st=r.runner.state();
    if(st.paused){ r.runner.resume(); keepAwake(true); } else { r.runner.pause(); keepAwake(false); }
    setButtons(r,true); paint(r,true);
  }
  function skip(r){ if(active!==r)return; r.runner.skip(); paint(r,true); }
  function toggleDisplay(r){
    const run=el(r,"run"), on=!document.body.classList.contains("display");
    $$(".run").forEach(x=>x.classList.remove("show"));
    document.body.classList.toggle("display",on); run.classList.toggle("show",on);
    $$(".run [id$='-full'] [data-i18n]").forEach(s=>{ s.dataset.i18n=on?"ui.exitFull":"ui.full"; s.textContent=t(s.dataset.i18n); });
    try{
      if(on&&document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
      else if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
    }catch(e){}
    if(active===r)paint(r,true);
  }
  document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement&&document.body.classList.contains("display")){ const r=$(".run.show"); if(r)toggleDisplay(r.id[0]==="t"?TR:CR); } });
  [TR,CR].forEach(r=>{
    el(r,"go").addEventListener("click",()=>start(r));
    el(r,"pause").addEventListener("click",()=>pauseToggle(r));
    el(r,"skip").addEventListener("click",()=>skip(r));
    el(r,"stop").addEventListener("click",()=>stop(r));
    el(r,"full").addEventListener("click",()=>{ unlockAudio(); toggleDisplay(r); });
  });
  document.addEventListener("keydown",ev=>{
    if(ev.target&&/^(INPUT|SELECT|TEXTAREA)$/.test(ev.target.tagName))return;
    if(ev.key==="Escape"&&document.body.classList.contains("display")){ const r=$(".run.show"); if(r)toggleDisplay(r.id[0]==="t"?TR:CR); }
    else if(active&&(ev.key===" "||ev.key==="Spacebar")&&!ev.target.closest("button")){ ev.preventDefault(); pauseToggle(active); }
  });

  /* ---------- interval timer settings ---------- */
  const TF={w:"#t-w",r:"#t-r",n:"#t-n",s:"#t-s",sr:"#t-sr"};
  function renderPresets(){
    $("#presets").innerHTML=PRESETS.map(p=>{
      const tot=E.fmtClock(E.totalOf(E.buildIntervalPhases(p.w,p.r,p.n,p.s,p.sr)));
      return '<button class="pre" data-p="'+p.id+'" aria-pressed="'+(S.timer.preset===p.id)+'"><b>'+esc(t("pre."+p.id))+'</b><span>'+esc(p.sub)+' · '+tot+'</span></button>';
    }).join("");
  }
  function syncTimerFields(){ for(const k in TF)$(TF[k]).value=S.timer[k]; }
  function renderTotals(){
    const c=S.timer; $("#t-total").textContent=(S.timer.preset?t("pre."+S.timer.preset):t("t.custom"))+" · "+t("t.total")+" "+E.fmtClock(E.totalOf(E.buildIntervalPhases(c.w,c.r,c.n,c.s,c.sr)));
    const cc=S.circuit, n=cc.list.length||cc.n;
    $("#c-total").textContent=t("c.stations")+": "+n+" · "+t("t.total")+" "+E.fmtClock(E.totalOf(E.buildCircuitPhases(n,cc.T,cc.R)));
  }
  $("#presets").addEventListener("click",ev=>{
    const b=ev.target.closest("[data-p]"); if(!b)return; const p=PRESETS.find(x=>x.id===b.dataset.p);
    S.timer={w:p.w,r:p.r,n:p.n,s:p.s,sr:p.sr,preset:p.id}; syncTimerFields(); renderPresets(); renderTotals(); save();
  });
  for(const k in TF)$(TF[k]).addEventListener("change",()=>{
    const lim={w:E.LIMITS.w,r:E.LIMITS.r,n:E.LIMITS.n,s:E.LIMITS.s,sr:E.LIMITS.sr}[k];
    S.timer[k]=E.clampInt($(TF[k]).value,lim); $(TF[k]).value=S.timer[k];
    const p=PRESETS.find(x=>x.w===S.timer.w&&x.r===S.timer.r&&x.n===S.timer.n&&x.s===S.timer.s&&(x.s===1||x.sr===S.timer.sr));
    S.timer.preset=p?p.id:""; renderPresets(); renderTotals(); save();
  });

  /* ---------- stations ---------- */
  const CF={focus:"#c-focus",n:"#c-n",T:"#c-t",R:"#c-r"};
  function syncCircuitFields(){ for(const k in CF)$(CF[k]).value=S.circuit[k]; }
  function renderPlan(now){
    const list=S.circuit.list; $("#c-plan").hidden=!list.length; $("#c-run").hidden=!list.length;
    $("#c-list").innerHTML=list.map((id,i)=>{ const e=EXI[id];
      return '<div class="st'+(i===now?" now":"")+'"><div class="ix">'+(i+1)+'</div><div class="nm"><b>'+esc(L(e.name))+'</b><span>'+esc(L(e.mus))+' · '+esc(t("grp."+e.grp))+'</span></div>'+figHTML(e,52,"thumb")+'</div>'; }).join("");
  }
  for(const k in CF)$(CF[k]).addEventListener("change",()=>{
    if(k==="focus")S.circuit.focus=$(CF[k]).value;
    else{ S.circuit[k]=E.clampInt($(CF[k]).value,{n:E.LIMITS.cn,T:E.LIMITS.cT,R:E.LIMITS.cR}[k]); $(CF[k]).value=S.circuit[k]; }
    renderTotals(); save();
  });
  $("#c-gen").addEventListener("click",()=>{
    if(active===CR)stop(CR,true);
    const seed=(Date.now()^Math.floor(Math.random()*0x7fffffff))>>>0;
    S.circuit.list=E.generateCircuit(EXS,S.circuit.focus,S.circuit.n,seed);
    CR.finished=false; CR.stoppedMsg=false;
    renderPlan(-1); renderTotals(); renderIdle(CR); save();
    el(CR,"next").textContent=t("c.drawnN",S.circuit.list.length);
  });

  /* ---------- library ---------- */
  function renderFilters(){
    $("#l-filters").innerHTML=["all"].concat(E.FOCUS).map(g=>'<button class="chip" data-g="'+g+'" aria-pressed="'+(S.libFilter===g)+'">'+esc(g==="all"?t("ui.all"):t("grp."+g))+'</button>').join("");
  }
  function renderLib(){
    const list=EXS.filter(e=>S.libFilter==="all"||e.grp===S.libFilter);
    $("#l-grid").innerHTML=list.map(e=>'<button class="ex" data-id="'+e.id+'">'+figHTML(e,96)+'<b>'+esc(L(e.name))+'</b><span>'+esc(t("grp."+e.grp))+' · '+esc(L(e.mus))+'</span></button>').join("");
  }
  $("#l-filters").addEventListener("click",ev=>{ const b=ev.target.closest("[data-g]"); if(!b)return; S.libFilter=b.dataset.g; renderFilters(); renderLib(); save(); });
  $("#l-grid").addEventListener("click",ev=>{ const b=ev.target.closest("[data-id]"); if(b)openEx(b.dataset.id); });
  function openEx(id){
    const e=EXI[id]; if(!e)return;
    $("#ex-title").textContent=L(e.name);
    $("#ex-body").innerHTML='<div class="dlg-fig">'+figHTML(e,180,"",true)+'</div>'+
      '<div class="pills"><span class="pill acc">'+esc(t("grp."+e.grp))+'</span><span class="pill">'+esc(L(e.mus))+'</span><span class="pill">'+esc(t("l.equip"))+': '+esc(L(D.eq[e.eq]))+'</span></div>'+
      '<h4>'+esc(t("l.cues"))+'</h4><ul>'+e.cues.map(c=>'<li>'+esc(L(c))+'</li>').join("")+'</ul>'+
      '<h4>'+esc(t("l.mis"))+'</h4><ul>'+e.mis.map(c=>'<li>'+esc(L(c))+'</li>').join("")+'</ul>'+
      '<h4>'+esc(t("l.dose"))+'</h4><div class="pills">'+["easy","medium","advanced"].map(k=>'<span class="pill">'+esc(t("lvl."+k))+': <b>'+esc(volume(e.reps[k]))+'</b></span>').join("")+'</div>';
    openDlg($("#ex-dlg"));
  }
  function openDlg(d){ try{ d.showModal(); }catch(e){ d.setAttribute("open",""); } }
  $$("dialog [data-close]").forEach(b=>b.addEventListener("click",()=>{ const d=b.closest("dialog"); try{ d.close(); }catch(e){ d.removeAttribute("open"); } }));
  $$("dialog").forEach(d=>d.addEventListener("click",ev=>{ if(ev.target===d)d.close(); }));

  /* ---------- dice ---------- */
  let lastRoll=null;
  function renderDiceLabels(){
    if(!lastRoll)return; const e=EXI[lastRoll.id], amt=lastRoll.isTime?lastRoll.amount+" "+unit("s"):String(lastRoll.amount);
    $("#die1").innerHTML='<div><div class="top sm">'+esc(L(e.name))+'</div><div class="bot">'+esc(t("grp."+e.grp))+'</div></div>';
    $("#die2").innerHTML='<div><div class="top">'+esc(amt)+'</div><div class="bot">'+esc(lastRoll.isTime?t("d.time"):t("d.reps"))+'</div></div>';
    $("#dice-res").textContent="🎯 "+L(e.name)+" × "+amt;
    $("#dice-fig").innerHTML=figHTML(e,120,"",true);
    return amt;
  }
  $("#roll").addEventListener("click",()=>{
    unlockAudio();
    const d1=$("#die1"),d2=$("#die2"); [d1,d2].forEach(d=>{ d.classList.remove("roll"); void d.offsetWidth; d.classList.add("roll"); });
    beep(700,0.1); setTimeout(()=>beep(900,0.1),200);
    const res=E.rollDice(EXS,(Date.now()^Math.floor(Math.random()*0x7fffffff))>>>0);
    $("#roll").disabled=true;
    setTimeout(()=>{ lastRoll=res; const amt=renderDiceLabels(); horn(); say(L(EXI[res.id].name)+", "+amt); $("#roll").disabled=false; },680);
  });

  /* ---------- header, tabs, about ---------- */
  function showTab(tab){
    S.tab=tab;
    $$("nav.tabs [data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));
    E.TABS.forEach(x=>{ $("#sec-"+x).hidden=x!==tab; });
  }
  $$("nav.tabs [data-tab]").forEach(b=>b.addEventListener("click",()=>{ showTab(b.dataset.tab); save(); }));
  $("#lang").addEventListener("change",()=>{ S.lang=$("#lang").value; applyLang(); save(); });
  function paintToggles(){
    $("#snd").setAttribute("aria-pressed",String(S.sound));
    $("#voice").setAttribute("aria-pressed",String(VOICE_OK&&S.voice)); $("#voice").disabled=!VOICE_OK;
    $("#voice-na").hidden=VOICE_OK; if(!VOICE_OK)$("#voice").title=t("ui.voiceNA");
  }
  $("#snd").addEventListener("click",()=>{ S.sound=!S.sound; if(S.sound)unlockAudio(); paintToggles(); save(); });
  $("#voice").addEventListener("click",()=>{ if(!VOICE_OK)return; S.voice=!S.voice; if(!S.voice)try{speechSynthesis.cancel();}catch(e){} paintToggles(); save(); });
  $("#test-snd").addEventListener("click",()=>{ const was=S.sound; S.sound=true; unlockAudio(); beep(660,0.12); tone(990,0.18,"square",0.22,0.18); S.sound=was; paintToggles(); });
  $("#about-btn").addEventListener("click",()=>openDlg($("#about-dlg")));

/* ===== C18: backup-first "Delete all data on this device" + optional restore =====
   Touches ONLY this tool's own browser-storage keys; every other key is left alone.
   Flow: button -> in-page dialog (what is erased) -> "Download backup (JSON)" -> typed-word confirmation -> remove own keys -> reload.
   "Delete without backup" is a secondary text link on the first step and still needs the typed word. No blocking browser dialogs. */
const DD=(()=>{
  const TOOL="pe-interval-trainer",FORMAT='pe-ultimate-tool-backup';
  const isOwn=k=>k===KEY;
  const isRestorable=k=>k===KEY;
  const validateKeys=keys=>{try{const o=JSON.parse(keys[KEY]);return !!o&&typeof o==='object'&&!Array.isArray(o)&&o.v===1;}catch(e){return false;}};
  const setFrozen=on=>{ddFrozen=on;};
  const q=id=>document.getElementById(id);
  const tr=(k,...a)=>{let s=String(tx(k));a.forEach((v,i)=>{s=s.split('{'+i+'}').join(String(v));});return s;};
  const store=()=>{try{return getLS();}catch(e){return null;}};
  function ownKeys(st){const out=[];try{for(let i=0;i<st.length;i++){const k=st.key(i);if(typeof k==='string'&&isOwn(k))out.push(k);}}catch(e){}return out.sort();}
  function snapshot(st){const keys={};for(const k of ownKeys(st)){let v=null;try{v=st.getItem(k);}catch(e){}if(typeof v==='string')keys[k]=v;}return keys;}
  function buildBackup(st,now){return {format:FORMAT,version:1,tool:TOOL,exportedAt:new Date(now===undefined?Date.now():now).toISOString(),keys:snapshot(st)};}
  function parseBackup(text){
    try{
      if(typeof text!=='string'||text.length>2000000)return null;
      const o=JSON.parse(text);
      if(!o||typeof o!=='object'||o.format!==FORMAT||o.version!==1||o.tool!==TOOL||!o.keys||typeof o.keys!=='object'||Array.isArray(o.keys))return null;
      const ks=Object.keys(o.keys);
      if(!ks.length)return null;
      for(const k of ks){if(!isRestorable(k)||typeof o.keys[k]!=='string'||o.keys[k].length>1000000)return null;}
      return validateKeys(o.keys)?o:null;
    }catch(e){return null;}
  }
  function removeOwn(st){try{ownKeys(st).forEach(k=>st.removeItem(k));return ownKeys(st).length===0;}catch(e){return false;}}
  function writeKeys(st,keys){
    const prev={};
    try{for(const k of Object.keys(keys))prev[k]=st.getItem(k);for(const k of Object.keys(keys))st.setItem(k,keys[k]);return true;}
    catch(e){try{for(const k of Object.keys(prev)){if(prev[k]===null)st.removeItem(k);else st.setItem(k,prev[k]);}}catch(e2){}return false;}
  }
  function download(name,text){
    try{const blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);return true;}
    catch(e){return false;}
  }
  const fileName=()=>TOOL+'-backup-'+new Date().toISOString().slice(0,10)+'.json';

  const dlg=q('dd-dlg');let opener=null,pending=null,backupMade=false;
  const msg=s=>{q('dd-msg').textContent=s||'';};
  function openDlg(){try{dlg.showModal();}catch(e){dlg.setAttribute('open','');}}
  function localize(){
    document.querySelectorAll('#dd-dlg [data-dd]').forEach(el=>{el.textContent=tr(el.dataset.dd);});
    q('dd-prompt').textContent=tr('confirmPrompt');q('dd-wordshow').textContent=tr('word');
    q('dd-word').setAttribute('aria-label',tr('confirmPrompt')+' '+tr('word'));
  }
  function show(n,focusId){
    for(const i of [0,1,2,3])q('dd-s'+i).hidden=i!==n;
    q('dd-title').textContent=tr(n===3?'restoreTitle':'title');
    if(focusId){const el=q(focusId);if(el&&el.focus)el.focus();}
  }
  function wordOk(){return q('dd-word').value.trim().toLocaleUpperCase()===tr('word').toLocaleUpperCase();}
  function openDelete(from){
    opener=from||null;pending=null;backupMade=false;msg('');localize();
    
    const st=store(),n=st?ownKeys(st).length:0;
    q('dd-found').textContent=tr('found',n);q('dd-word').value='';q('dd-confirm').disabled=true;
    openDlg();
    if(!n)show(0,'dd-close0');else show(1,'dd-backup');
  }
  function toStep2(){
    show(2,'dd-word');q('dd-status').textContent=tr(backupMade?'backupDone':'noBackup');msg('');
  }
  function openRestore(from,text){
    opener=from||null;backupMade=false;msg('');localize();
    pending=parseBackup(text);
    const st=store(),has=!!(st&&ownKeys(st).length);
    openDlg();
    const ok=!!pending;
    q('dd-s3msg').textContent=ok?tr('restoreInfo',new Date(pending.exportedAt).toLocaleString()):tr('restoreBad');
    q('dd-go').hidden=!ok;q('dd-cur').hidden=!ok||!has;
    show(3,ok?'dd-go':'dd-close3');
  }
  q('dd-backup').onclick=()=>{
    const st=store(),b=st?buildBackup(st):null;
    if(!b||!Object.keys(b.keys).length||!download(fileName(),JSON.stringify(b,null,2))){msg(tr('backupFail'));return;}
    backupMade=true;toStep2();
  };
  q('dd-skip').onclick=()=>{backupMade=false;toStep2();};
  q('dd-word').oninput=()=>{q('dd-confirm').disabled=!wordOk();};
  q('dd-word').onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();if(wordOk())q('dd-confirm').click();}};
  q('dd-confirm').onclick=()=>{
    if(!wordOk())return;
    const st=store();
    setFrozen(true);
    if(!st||!removeOwn(st)){setFrozen(false);msg(tr('deleteFail'));return;}
    location.reload();
  };
  q('dd-cur').onclick=()=>{
    const st=store(),b=st?buildBackup(st):null;
    msg(b&&Object.keys(b.keys).length&&download(fileName(),JSON.stringify(b,null,2))?tr('backupDone'):tr('backupFail'));
  };
  q('dd-go').onclick=()=>{
    const st=store();
    if(!pending||!st)return;
    setFrozen(true);
    if(!writeKeys(st,pending.keys)){setFrozen(false);msg(tr('restoreFail'));return;}
    location.reload();
  };
  document.querySelectorAll('#dd-dlg .dd-close').forEach(b=>{b.onclick=()=>{try{dlg.close();}catch(e){dlg.removeAttribute('open');}};});
  dlg.onclose=()=>{pending=null;q('dd-word').value='';if(opener&&opener.focus)opener.focus();};
  q("dd-open").onclick=ev=>openDelete(ev.currentTarget||q("dd-open"));
  q("dd-restore").onclick=()=>q('dd-file').click();
  q('dd-file').onchange=()=>{
    const f=q('dd-file').files&&q('dd-file').files[0];
    q('dd-file').value='';
    if(!f)return;
    const from=q("dd-restore");
    if(f.size>2000000){openRestore(from,null);return;}
    const r=new FileReader();
    r.onload=()=>openRestore(from,String(r.result));
    r.onerror=()=>openRestore(from,null);
    r.readAsText(f);
  };
  return {api:{ownKeys,buildBackup,parseBackup,removeOwn,writeKeys,FORMAT,openDelete:()=>openDelete(q("dd-open"))}};
})();

  /* ---------- boot ---------- */
  syncTimerFields(); syncCircuitFields(); paintToggles(); showTab(S.tab); applyLang();
  if(store.status==="blocked")showStoreNote();

  /* Public, read-only hooks (same idea as the boards' PEScoreboard / PECoachBoard). */
  window.PEIntervalTrainer={
    version:D.version,
    storageKey:KEY,
    deviceData:DD.api,
    setLanguage(code){ if(D.langs.includes(code)){ S.lang=code; applyLang(); save(); } },
    getState(){ const st=active?active.runner.state():null;
      return JSON.parse(JSON.stringify({settings:S,storage:store.status,running:!!active,mode:active?active.kind:null,
        phase:st&&st.phase?{index:st.i,kind:st.phase.kind,remain:st.remain}:null,paused:!!(st&&st.paused),
        finished:{timer:!!TR.finished,circuit:!!CR.finished},audioContexts:audioMade,voice:VOICE_OK})); },
    /* test hook: run the clock faster (e.g. 20×) to exercise a full preset quickly */
    __test:{setClockSpeed(x){ clock.set(Math.max(0.1,Math.min(1000,Number(x)||1))); }}
  };
})();
</script>
</body>
</html>
